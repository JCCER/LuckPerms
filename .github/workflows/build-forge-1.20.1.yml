name: Build Forge 1.20.1

on:
  push:
    branches: [forge-1.20.1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-1.20.1-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history + tags: the patch version is derived from `git describe --tags`
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :forge:loader:build -x test --stacktrace

      - name: Resolve artifact
        id: artifact
        run: |
          JAR=$(ls forge/loader/build/libs/LuckPerms-Forge-*.jar)
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuckPerms-Forge-1.20.1
          path: ${{ steps.artifact.outputs.jar }}
          if-no-files-found: error

      - name: Move rolling release tag to this commit
        run: |
          git tag -f forge-1.20.1-latest "$GITHUB_SHA"
          git push -f origin refs/tags/forge-1.20.1-latest

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: forge-1.20.1-latest
          name: Forge 1.20.1 - ${{ steps.artifact.outputs.name }}
          prerelease: true
          body: |
            Automated build of the `forge-1.20.1` branch (master common core on Forge 1.20.1).

            - Commit: ${{ github.sha }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Target: Forge 1.20.1-47.4.29, Java 17

            This is a rolling pre-release: the tag and assets are replaced on every push to the branch.
          files: ${{ steps.artifact.outputs.jar }}
          fail_on_unmatched_files: true